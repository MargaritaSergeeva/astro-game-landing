server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Security
    server_tokens off;
    add_header X-Frame-Options         "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options  "nosniff"                         always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # Gzip
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Hashed static assets — immutable long-term cache
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|webp|avif|svg)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files  $uri =404;
    }

    # HTML — always revalidate
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files  $uri =404;
    }

    # Everything else
    # Astro trailingSlash: always → every page is a directory with index.html
    # nginx auto-redirects /about → /about/ when it finds the directory
    location / {
        try_files $uri $uri/ =404;
    }
}
